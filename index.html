<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>受保护的页面</title>
<style>
:root{--bg:#F3F5F8;--surface:#FFFFFF;--ink:#18212C;--muted:#586472;--line:#D8DEE6;--accent:#2446B0;--err:#B42318;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#10141A;--surface:#161C24;--ink:#E3E8EF;--muted:#9AA5B3;--line:#29323E;--accent:#9DB2FF;--err:#FF8A7D;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;font-size:15px;line-height:1.6;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 24px}
h1{font-size:1.2rem;margin:0 0 .3rem}
p{margin:0 0 1.1rem;color:var(--muted);font-size:.9rem}
label{font-size:.85rem}
.field{display:grid;gap:.35rem}
input[type=password]{width:100%;font:inherit;padding:.55rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.row{display:flex;align-items:center;gap:.45rem;margin:.8rem 0 1rem;color:var(--muted)}
button{width:100%;font:inherit;font-weight:600;padding:.55rem .8rem;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.msg{min-height:1.4em;margin-top:.7rem;font-size:.85rem;color:var(--err)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

    <button id="go" type="submit">解锁</button>
    <div class="msg" id="msg" role="alert" aria-live="polite"></div>
  </form>
</main>

  var k = saved();
  if (k) {
    crypto.subtle.importKey("raw", bytes(k), { name: "AES-GCM" }, false, ["decrypt"]).then(decrypt).then(show).catch(forget);
  }
  document.getElementById("f").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var pw = pwEl.value;
    if (!pw) return;
    btn.disabled = true; btn.textContent = "正在解锁…"; msg.textContent = "";
    try {
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      var buf = await decrypt(key);
      try {
        var val = JSON.stringify({ salt: P.salt, key: b64(await crypto.subtle.exportKey("raw", key)) });
        (document.getElementById("remember").checked ? localStorage : sessionStorage).setItem(STORE, val);
      } catch (e) {}
      show(buf);
    } catch (e) {
      msg.textContent = "密码不正确，请重试。";
      btn.disabled = false; btn.textContent = "解锁";
      pwEl.select();
    }
  });
})();
</script>
</body>
